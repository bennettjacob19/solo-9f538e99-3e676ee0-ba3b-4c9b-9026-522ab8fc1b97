# Prometheus scrapes the metrics-* services that svcdir publishes through
# file_sd.  The target file lives on the shared `svcdir-data` volume and is
# regenerated and atomically replaced by svcdir after every committed
# directory change; refresh_interval keeps target add/remove visible on the
# /targets page within a few seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: svcdir-directory
    file_sd_configs:
      - files:
          - /data/metrics-targets.json
        refresh_interval: 10s
